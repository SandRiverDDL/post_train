[project]
name = "post-train"
version = "0.1.0"
description = "Two-stage SFT + SIMPO math post-training pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "torch==2.9.1",
    "torchvision>=0.24.1",
    "torchaudio>=2.9.1",
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "trl",
    "bitsandbytes>=0.45.0",
    "unsloth",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "math-verify[antlr4-13-2]>=0.9.0",
    "lm-eval>=0.4.11",
    "wandb>=0.25.1",
]

model_name: outputs/stage1_sft_5000/checkpoint-200
train_dataset: data/stage2_mix_long_train.jsonl
output_dir: outputs/stage2_mix_long_sft
seed: 42
max_seq_length: 3072
learning_rate: 5.0e-6

epochs: 1
batch_size: 8
gradient_accumulation_steps: 2

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 5
group_by_length: true

save_strategy: steps
save_steps: 20
save_total_limit: 8

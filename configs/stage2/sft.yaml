model_name: outputs/stage1_sft/checkpoint-50
train_dataset: data/stage2/default/train.jsonl
output_dir: outputs/stage2_sft
seed: 42
max_seq_length: 2048
learning_rate: 2.0e-5

epochs: 2
batch_size: 16
gradient_accumulation_steps: 2

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 5
group_by_length: true


save_strategy: steps
save_steps: 20
save_total_limit: 12

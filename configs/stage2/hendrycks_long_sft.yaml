model_name: outputs/stage1_mix_long_sft/checkpoint-300
train_dataset: data/stage2/hendrycks_long/train.jsonl
output_dir: outputs/stage2_hendrycks_long_sft
seed: 42
max_seq_length: 3072
learning_rate: 1e-5

epochs: 1
batch_size: 4
gradient_accumulation_steps: 8

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 5
group_by_length: true

save_strategy: steps
save_steps: 15
save_total_limit: 12

inputs:
  - name: gsm8k_middiff
    path: data/grpo/train_grpo_gsm8k_3857_short_middiff.jsonl
    priority: 20

  - name: big_math_q2
    path: data/grpo/big_math_quintile2_filtered.jsonl
    priority: 10

dedup_against:
  - data/eval/gsm8k_dev200.jsonl
  - data/eval/math500_test.jsonl

merge_output: data/grpo/train_grpo_merged_pool.jsonl
merge_summary_output: data/grpo/train_grpo_merged_pool_summary.json
conflicts_output: data/grpo/train_grpo_merged_conflicts.jsonl

selection:
  target_size: 3000
  seed: 42
  fill_strategy: weighted
  per_source:
    gsm8k_middiff:
      min_count: 700
      max_count: 2400
    big_math_q2:
      min_count: 600
      max_count: 2300
  weights:
    gsm8k_middiff: 1.0
    big_math_q2: 1.0

final_output: data/grpo/train_grpo_merged_selected_3k.jsonl
selection_summary_output: data/grpo/train_grpo_merged_selected_3k_summary.json

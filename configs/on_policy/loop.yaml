extends: _base.loop.yaml
# 当前 on-policy 主实验入口。
# 通常只需要改：seed_model、round_query_count、max_rounds。
base_on_policy_data_config: configs/on_policy/data.yaml
base_sft_config: configs/on_policy/sft.yaml

# 当前实验策略：
# 30% 从 round1 的 all_correct bootstrap 池抽，
# 70% 从 round1 派生的 mixed 1000 题候选池抽。
query_strategy: mixed_bootstrap_candidate
bootstrap_all_correct_raw_samples: data/on_policy/raw_samples.round1.jsonl
candidate_query_file: data/on_policy/candidate_pool.mixed_1000.jsonl
bootstrap_ratio: 0.3
candidate_ratio: 0.7
candidate_freeze_all_correct_hits: 2

train_epochs: 1.0
train_learning_rate: 5.0e-6
round_base_dir: outputs/on_policy_loop
data_base_dir: data/on_policy_loop
backend: vllm
batch_size: 6
max_new_tokens: 1536

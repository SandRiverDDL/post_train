extends: _base.loop.yaml
base_on_policy_data_config: configs/on_policy/data_opsft.yaml
base_sft_config: configs/on_policy/opsft.yaml

max_rounds: 8
round_query_count: 640
query_strategy: candidate_random_mix
candidate_query_file: data/on_policy/candidate_pool.mixed_1000.jsonl
candidate_ratio: 0.5
random_ratio: 0.5

train_epochs: 1.0
train_learning_rate: 1.0e-6
advance_teacher_on_improvement_only: true
checkpoint_selection_enabled: true
checkpoint_target_count: 4
checkpoint_save_total_limit: 4

round_base_dir: outputs/on_policy_loop_opsft_smallpool
data_base_dir: data/on_policy_loop_opsft_smallpool
